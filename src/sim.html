<!DOCTYPE html><html><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Laser sim</title><style>
body{margin:0;font-family:system-ui;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px}
svg{width:min(92vw,80vh);height:auto;background:#1b1b1b;border-radius:8px}
#info{font-variant-numeric:tabular-nums;color:#aaa}
</style></head><body>
<div id=info>--</div>
<svg id=room viewBox="0 0 1475 1475">
<polygon id=outline fill="rgba(10,132,255,.15)" stroke="#0a84ff" stroke-width="6"/>
<g id=target stroke="#ffd60a" stroke-width="6"><line x1=-20 y1=0 x2=20 y2=0 /><line x1=0 y1=-20 x2=0 y2=20 /></g>
<circle id=dot r=18 stroke="#ff453a" stroke-width="6"/>
</svg>
<script>
// Flipped to match the D-pad: Left raises x, Up lowers y
let min=491,max=1966;
const sx=x=>max-x,sy=y=>y-min;
const $=id=>document.getElementById(id);
function draw(s){
min=s.travel[0];max=s.travel[1];
$('room').setAttribute('viewBox',`0 0 ${max-min} ${max-min}`);
$('outline').setAttribute('points',s.points.map(([x,y])=>sx(x)+','+sy(y)).join(' '));
$('dot').setAttribute('cx',sx(s.x));$('dot').setAttribute('cy',sy(s.y));
$('dot').setAttribute('fill',s.laser?'#ff453a':'none');
const t=$('target');t.style.display=s.target?'':'none';
if(s.target)t.setAttribute('transform',`translate(${sx(s.target[0])},${sy(s.target[1])})`);
const phase=s.phase?` · ${s.phase} ${Math.floor(s.phase_remaining_s/60)}:${String(s.phase_remaining_s%60).padStart(2,'0')}`:'';
$('info').textContent=`${s.names[s.preset]} · ${s.mode}${phase}${s.idle?' · '+s.idle:''} · (${s.x}, ${s.y})`;
}
function poll(){fetch('/sim/status').then(r=>r.json()).then(draw).catch(()=>{}).finally(()=>setTimeout(poll,100))}
poll();
</script></body></html>
