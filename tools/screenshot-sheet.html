<!doctype html>
<meta charset="utf-8">
<title>random-laser-pointer screenshots</title>
<style>html, body { margin: 0; background: transparent }</style>
<svg width="1450" height="1000" viewBox="0 0 1450 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.16"/>
    </filter>
    <clipPath id="phone-clip">
      <rect width="390" height="844" rx="34"/>
    </clipPath>
  </defs>
  <g transform="translate(60 50)" filter="url(#shadow)" aria-label="Random mode with the room outline">
    <rect width="390" height="844" rx="34" fill="#1a1625"/>
    <image href="../docs/screenshots/screenshot-random.png" width="390" height="844" preserveAspectRatio="xMidYMid slice" clip-path="url(#phone-clip)"/>
  </g>
  <g transform="translate(530 50)" filter="url(#shadow)" aria-label="Manual mode with the D-pad">
    <rect width="390" height="844" rx="34" fill="#1a1625"/>
    <image href="../docs/screenshots/screenshot-manual.png" width="390" height="844" preserveAspectRatio="xMidYMid slice" clip-path="url(#phone-clip)"/>
  </g>
  <g transform="translate(1000 50)" filter="url(#shadow)" aria-label="Outline editor">
    <rect width="390" height="844" rx="34" fill="#1a1625"/>
    <image href="../docs/screenshots/screenshot-outline.png" width="390" height="844" preserveAspectRatio="xMidYMid slice" clip-path="url(#phone-clip)"/>
  </g>
</svg>
