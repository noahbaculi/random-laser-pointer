[package]
name = "random-laser-pointer"
version = "0.1.0"
authors = ["Noah Baculi <noahbaculi@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Spike: WiFi D-pad latency probe on the modern esp-hal 1.x stack
edge-dhcp = "0.7.0"
edge-nal = "0.6.0"
edge-nal-embassy = "0.8.1"
embassy-executor = "0.10.0"
embassy-net = { version = "0.8.0", features = [
    "dhcpv4",
    "medium-ethernet",
    "tcp",
    "udp",
] }
embassy-sync = "0.7"
embassy-time = "0.5.0"
embedded-hal = "1.0.0"
embedded-io-async = "0.7"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
    "esp32c3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-hal = { version = "1.1.2", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = [
    "esp32c3",
    "log-04",
    "wifi",
] }
esp-rtos = { version = "0.3.0", features = [
    "esp32c3",
    "esp-radio",
    "embassy",
    "log-04",
] }
log = "0.4.27"
static_cell = "2.1.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
